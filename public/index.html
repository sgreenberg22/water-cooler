<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water Cooler</title>
<meta name="description" content="Your daily small-talk survival kit. Talking points from today's headlines, in your sense of humor.">
<meta name="theme-color" content="#15121f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column. Mascot + greeting up top, mode controls, a sticky-note
   weather card, then a stack of talking-point cards. Fixed EJECT button bottom-right.
   Each skin redefines every color token; Night Shift is the default. */
:root, :root[data-skin="nightshift"] {
  --bg:#15121f; --surface:#221e33; --surface-2:#2c2742; --ink:#f4f0ff; --muted:#aaa4c8; --line:rgba(255,255,255,.1);
  --a1:#ff5fa2; --a2:#3ee6e0; --a3:#ffe45c; --a4:#ff9b3d; --a5:#a78bff;
  --tag-ink:#17131f; --jug:#5ad8ff; --body:#ece7ff; --body-line:#c3bce6; --face:#17131f;
  --danger:#ff4d5e; --shadow:0 12px 32px rgba(0,0,0,.38); --blob:.32; --hl:#ff5fa2; --hl2:#3ee6e0;
  color-scheme: dark;
  --display:"Shrikhand", "Cooper Black", "Georgia", serif;
  --text:"Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:22px;
}
:root[data-skin="sunrise"] {
  --bg:#fff2e2; --surface:#ffffff; --surface-2:#ffe7cf; --ink:#2a1a12; --muted:#8b6b57; --line:rgba(42,26,18,.12);
  --a1:#ff6b4a; --a2:#2ec4b6; --a3:#ffc21a; --a4:#ff7eb6; --a5:#8fa8ff;
  --tag-ink:#2a1a12; --jug:#4cc3ff; --body:#ffffff; --body-line:#f1cfae; --face:#2a1a12;
  --danger:#e8363f; --shadow:0 12px 28px rgba(140,80,30,.16); --blob:.38; --hl:#d9401c; --hl2:#0f8a80; color-scheme: light;
}
:root[data-skin="breakroom"] {
  --bg:#dcf2e6; --surface:#fbfffd; --surface-2:#e6f7ee; --ink:#123528; --muted:#557a6b; --line:rgba(18,53,40,.12);
  --a1:#ff6a55; --a2:#2bb39a; --a3:#ffd23f; --a4:#b28dff; --a5:#5ab0ff;
  --tag-ink:#123528; --jug:#62cdf5; --body:#ffffff; --body-line:#b4d8c6; --face:#123528;
  --danger:#e5383b; --shadow:0 12px 28px rgba(20,80,55,.16); --blob:.35; --hl:#d23b2a; --hl2:#17806e; color-scheme: light;
}
:root[data-skin="bubblegum"] {
  --bg:#ffe0ef; --surface:#fff7fb; --surface-2:#ffe9f4; --ink:#3b0f2e; --muted:#985c84; --line:rgba(59,15,46,.12);
  --a1:#ff4fa3; --a2:#8c7bff; --a3:#3fd6c9; --a4:#ffb648; --a5:#b9f25d;
  --tag-ink:#3b0f2e; --jug:#7fd8ff; --body:#ffffff; --body-line:#f4bcd9; --face:#3b0f2e;
  --danger:#e8304f; --shadow:0 12px 28px rgba(150,30,100,.16); --blob:.4; --hl:#d8137a; --hl2:#5b47db; color-scheme: light;
}
:root[data-skin="arcade"] {
  --bg:#07060c; --surface:#121120; --surface-2:#1b1931; --ink:#eafff1; --muted:#8f8cad; --line:rgba(234,255,241,.12);
  --a1:#39ff88; --a2:#ff3ed1; --a3:#f8f32b; --a4:#3ea6ff; --a5:#ff7a2e;
  --tag-ink:#07060c; --jug:#3ea6ff; --body:#1d1b33; --body-line:#39ff88; --face:#eafff1;
  --danger:#ff2e63; --shadow:0 0 0 1px rgba(57,255,136,.25), 0 14px 32px rgba(0,0,0,.6); --blob:.28; --hl:#39ff88; --hl2:#ff3ed1; color-scheme: dark;
}
:root[data-skin="cubicle"] {
  --bg:#e5ddc8; --surface:#f6f1e2; --surface-2:#ece4cd; --ink:#36352d; --muted:#787362; --line:rgba(54,53,45,.14);
  --a1:#f2d24b; --a2:#8fcf6a; --a3:#e8735e; --a4:#8eaee0; --a5:#d9a066;
  --tag-ink:#2c2b24; --jug:#9cc9de; --body:#f2eee2; --body-line:#bdb59c; --face:#36352d;
  --danger:#d33a2c; --shadow:0 10px 22px rgba(70,60,30,.16); --blob:.22; --hl:#b4402c; --hl2:#3f66a8; color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--text); -webkit-font-smoothing: antialiased;
  transition: background-color .4s ease, color .4s ease; overflow-x: hidden;
}
body::before, body::after {
  content: ""; position: fixed; z-index: 0; pointer-events: none; border-radius: 50%;
  filter: blur(70px); opacity: var(--blob); width: 60vmax; height: 60vmax;
}
body::before { background: var(--a1); top: -30vmax; left: -25vmax; animation: drift 22s ease-in-out infinite alternate; }
body::after  { background: var(--a2); bottom: -35vmax; right: -30vmax; animation: drift 26s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.08); } }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--a2); outline-offset: 2px; border-radius: 10px; }
.mono { font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 140px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-block: 10px; margin-inline: -16px; padding-inline: 16px;
  background: color-mix(in oklab, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo { font-family: var(--display); font-size: 1.35rem; line-height: 1; white-space: nowrap; letter-spacing: .01em; }
.logo span { color: var(--hl2); }
.top-actions { display: flex; gap: 6px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 11px; white-space: nowrap; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-size: .9rem;
  transition: transform .15s ease;
}
.chip:active, .iconbtn:active { transform: scale(.92); }
.chip.cold .flame { filter: grayscale(1); opacity: .6; }
.chip .sep { width: 1px; height: 16px; background: var(--line); margin: 0 3px; }
.top-actions { flex: none; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); font-size: 1.05rem; transition: transform .15s ease; }
.flame { display: inline-block; animation: flicker 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flicker { 50% { transform: scale(1.12) rotate(-4deg); } }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; padding-block: 18px 8px; }
.mascot-wrap { position: relative; }
#gulp { width: 112px; height: auto; display: block; cursor: pointer; overflow: visible; animation: pop-in .7s cubic-bezier(.2,1.6,.4,1) both; }
#gulp .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 60px 140px; }
#gulp.jump .bob { animation: jump .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes jump { 30% { transform: translateY(-16px) scaleY(1.05); } 60% { transform: translateY(0) scaleY(.92); } }
#gulp .lid { animation: blink 5s infinite; transform-origin: center; transform-box: fill-box; transform: scaleY(0); }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }
#gulp .bub { fill: #fff; opacity: .7; animation: rise 3.4s linear infinite; }
#gulp .bub:nth-of-type(2) { animation-delay: 1.1s; animation-duration: 2.8s; }
#gulp .bub:nth-of-type(3) { animation-delay: 2.2s; animation-duration: 3.9s; }
@keyframes rise { from { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } to { transform: translateY(-46px); opacity: 0; } }
#gulp.glug .bub { animation-duration: .7s; }
#gulp .mouth-happy, #gulp .mouth-panic, #gulp .mouth-sleep, #gulp .sweat, #gulp .zzz { display: none; }
#gulp.happy .mouth-idle, #gulp.panic .mouth-idle, #gulp.sleepy .mouth-idle { display: none; }
#gulp.happy .mouth-happy, #gulp.panic .mouth-panic, #gulp.sleepy .mouth-sleep { display: inline; }
#gulp.panic .sweat { display: inline; animation: sweat .8s ease-in infinite; }
#gulp.panic .bob { animation: shake .25s linear infinite; }
#gulp.sleepy .lid { transform: scaleY(.65); animation: none; }
#gulp.sleepy .zzz { display: inline; animation: zz 2.4s ease-in-out infinite; }
@keyframes shake { 25% { transform: translateX(-2px) rotate(-2deg); } 75% { transform: translateX(2px) rotate(2deg); } }
@keyframes sweat { from { transform: translateY(0); opacity: 1; } to { transform: translateY(12px); opacity: 0; } }
@keyframes zz { 50% { transform: translate(4px, -6px); opacity: .5; } }

.speech { min-height: 4.4rem; }
.bubble {
  position: relative; display: block; width: fit-content; max-width: 100%;
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: .88rem; line-height: 1.35;
  padding: 9px 12px; border-radius: 4px 16px 16px 16px; box-shadow: var(--shadow);
  transform-origin: 0 0; animation: bubble-in .35s cubic-bezier(.2,1.5,.4,1) both;
}
.bubble::before { content: ""; position: absolute; left: -7px; top: 0; border: 8px solid transparent; border-top-color: var(--ink); border-right-color: var(--ink); border-width: 0 8px 8px 0; }
.bubble[hidden] { display: none !important; }
@keyframes bubble-in { from { transform: scale(.3); opacity: 0; } }

.hero-text { min-width: 0; }
.hero .date { color: var(--muted); }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.75rem, 7.5vw, 2.35rem); line-height: 1.05; margin: 4px 0 6px; text-wrap: balance; animation: slide-up .6s .1s cubic-bezier(.2,1,.3,1) both; }
.hero h1 em { font-style: normal; color: var(--hl); }
.hero .sub { margin: 0; color: var(--muted); font-size: .95rem; }

/* ---------- controls ---------- */
.controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-block: 12px 4px; }
.seg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; position: relative; }
.seg button { position: relative; z-index: 1; padding: 10px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 999px; font-weight: 800; font-size: .92rem; transition: color .25s; }
.seg .knob { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--a2); transition: transform .35s cubic-bezier(.3,1.4,.5,1), background-color .3s; }
.seg[data-v="opinion"] .knob { transform: translateX(100%); background: var(--a1); }
.seg button[aria-pressed="true"] { color: var(--tag-ink); }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.humor { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px; }
.humor::-webkit-scrollbar { display: none; }
.hchip { flex: none; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: .86rem; transition: transform .15s, background-color .2s, border-color .2s; }
.hchip[aria-pressed="true"] { background: var(--a3); color: var(--tag-ink); border-color: transparent; transform: rotate(-2deg); }
.shuffle { flex: none; height: 38px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1.5px dashed var(--muted); font-weight: 800; font-size: .86rem; }
.shuffle:active { transform: rotate(-6deg) scale(.95); }

/* ---------- notices ---------- */
.notice { display: flex; gap: 10px; align-items: center; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface-2); border: 1px dashed var(--muted); font-size: .9rem; }
.notice b { font-weight: 800; }
.notice .btn-sm { margin-left: auto; flex: none; }
.btn-sm { padding: 8px 12px; border-radius: 999px; background: var(--a1); color: var(--tag-ink); font-weight: 800; font-size: .85rem; }

/* ---------- weather sticky note ---------- */
.stack { display: grid; gap: 16px; margin-top: 16px; }
.note {
  position: relative; background: var(--a3); color: var(--tag-ink); border-radius: 4px 4px 18px 4px;
  padding: 18px 16px 14px; transform: rotate(-1.2deg); box-shadow: var(--shadow);
  animation: card-in .6s cubic-bezier(.2,1.3,.4,1) both;
}
.note::before { content: ""; position: absolute; top: -10px; left: 50%; width: 86px; height: 22px; transform: translateX(-50%) rotate(2deg); background: color-mix(in oklab, #ffffff 55%, transparent); border-radius: 2px; }
.note .mono { opacity: .75; display: flex; justify-content: space-between; gap: 8px; }
.note .temp { font-family: var(--display); font-size: 2.1rem; line-height: 1; margin: 6px 0 2px; }
.note .line { font-weight: 800; font-size: 1.12rem; line-height: 1.3; margin: 6px 0 4px; }
.note .ask { margin: 0; font-size: .9rem; opacity: .8; }
.note button { text-decoration: underline; text-underline-offset: 3px; font-weight: 600; font-size: .8rem; }

/* ---------- talking point cards ---------- */
.card {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; box-shadow: var(--shadow); overflow: hidden;
}
.card.enter { animation: card-in .6s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes card-in { from { transform: translateY(22px) scale(.96) rotate(var(--tilt, 0deg)); opacity: .2; } }
@keyframes pop-in { from { transform: scale(.5); opacity: .2; } }
@keyframes slide-up { from { transform: translateY(12px); opacity: .2; } }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--cat); color: var(--tag-ink); font-family: var(--mono); font-size: .62rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spice { font-size: .8rem; letter-spacing: -2px; }
.story { margin: 12px 0 12px; display: grid; gap: 6px; }
.headline { margin: 0; font-weight: 800; color: var(--ink); font-size: 1rem; line-height: 1.35; display: flex; gap: 8px; }
.what { margin: 0 0 0 30px; color: var(--muted); font-size: .92rem; line-height: 1.45; }
.src { margin: 0 0 0 30px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-family: var(--mono); font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.src a { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--cat); text-decoration-thickness: 2px; text-underline-offset: 3px; padding: 4px 0; }
.headline .pe { font-size: 1.3rem; line-height: 1; flex: none; }
.say { background: color-mix(in oklab, var(--cat) 17%, var(--surface)); border-radius: 16px; padding: 12px 14px 14px; }
.say .mono { color: var(--muted); display: block; margin-bottom: 4px; }
.say-line { margin: 0; font-weight: 800; font-size: 1.18rem; line-height: 1.32; text-wrap: pretty; }
.say-line.flip { animation: flip .45s cubic-bezier(.3,1.3,.5,1); }
@keyframes flip { from { transform: rotateX(80deg); opacity: .2; } }
details.deeper { margin-top: 10px; }
details.deeper summary { list-style: none; cursor: pointer; font-weight: 800; font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; }
details.deeper summary::-webkit-details-marker { display: none; }
details.deeper summary::before { content: "＋"; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); font-size: .8rem; transition: transform .25s; }
details.deeper[open] summary::before { transform: rotate(45deg); }
.deep-body { display: grid; gap: 8px; padding: 6px 0 2px; font-size: .95rem; }
.deep-body p { margin: 0; }
.deep-body b { font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; display: block; color: var(--muted); font-weight: 600; }
.deep-body a { color: inherit; font-size: .82rem; opacity: .7; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.act { padding: 8px 12px; border-radius: 999px; background: var(--surface-2); font-weight: 800; font-size: .85rem; transition: transform .12s, background-color .2s; }
.act:active { transform: scale(.94); }
.act.primary { background: var(--cat); color: var(--tag-ink); }
.rate-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.rate-opts .act { animation: pop-in .3s cubic-bezier(.2,1.6,.4,1) both; }
.rate-opts .act:nth-child(2) { animation-delay: .05s; } .rate-opts .act:nth-child(3) { animation-delay: .1s; }
.rated-note { font-size: .82rem; color: var(--muted); }
.stamp {
  position: absolute; right: 12px; top: 8px; pointer-events: none; background: var(--surface); font-family: var(--mono); font-weight: 600;
  font-size: .82rem; letter-spacing: .1em; padding: 6px 10px; border: 3px solid currentColor; border-radius: 8px;
  transform: rotate(-14deg); opacity: .85; mix-blend-mode: normal;
}
.stamp.nailed { color: var(--a2); } .stamp.survived { color: var(--a4); } .stamp.flopped { color: var(--danger); }
.stamp.thud { animation: thud .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes thud { from { transform: rotate(-14deg) scale(2.6); opacity: 0; } }

.skeleton { min-height: 210px; display: grid; align-content: center; justify-items: center; gap: 10px; text-align: center; color: var(--muted); }
.skeleton .dots { display: flex; gap: 6px; }
.skeleton .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--cat, var(--a2)); animation: dot 1s ease-in-out infinite; }
.skeleton .dots i:nth-child(2) { animation-delay: .15s; } .skeleton .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-8px); } }

.foot { margin-top: 28px; text-align: center; color: var(--muted); font-size: .8rem; display: grid; gap: 4px; }

/* ---------- eject ---------- */
.eject {
  position: fixed; z-index: 30; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-radius: 999px;
  background: var(--danger); color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: .02em;
  box-shadow: 0 10px 26px color-mix(in oklab, var(--danger) 55%, transparent);
}
.eject::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 3px solid var(--danger); animation: ring 2s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
.eject:active { transform: scale(.94); }
.eject .siren { display: inline-block; animation: wob 1.2s ease-in-out infinite; }
@keyframes wob { 50% { transform: rotate(-14deg); } }

.overlay {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px;
  background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--danger) 92%, #000) 0 26px, color-mix(in oklab, var(--danger) 70%, #000) 26px 52px);
  background-size: 74px 74px; animation: hazard 1s linear infinite;
}
@keyframes hazard { to { background-position: 74px 0; } }
.eject-card { width: min(460px, 100%); background: var(--surface); color: var(--ink); border-radius: 26px; padding: 22px 20px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: slam .5s cubic-bezier(.2,1.7,.4,1) both; display: grid; gap: 12px; }
@keyframes slam { from { transform: scale(.4) rotate(-6deg); opacity: 0; } }
.eject-card .mono { color: var(--danger); text-align: center; font-size: .72rem; }
.eject-line { font-family: var(--display); font-size: clamp(1.5rem, 6.5vw, 2rem); line-height: 1.15; margin: 0; text-align: center; text-wrap: balance; }
.eject-follow { margin: 0; text-align: center; color: var(--muted); }
.eject-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.bigbtn { padding: 14px; border-radius: 16px; font-weight: 800; background: var(--surface-2); }
.bigbtn.go { background: var(--a2); color: var(--tag-ink); }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10,8,18,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: fixed; z-index: 51; left: 50%; bottom: 0; width: min(560px, 100%); transform: translateX(-50%);
  max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;

  const total = counts.nailed + counts.survived + counts.flopped;
  let ri = 0; RANKS.forEach(([min], i) => { if (xp >= min) ri = i; });
  const next = RANKS[ri + 1];
  return { streak, usedToday: days.has(today), xp, counts, total, hit: total ? Math.round(((counts.nailed + counts.survived) / total) * 100) : null, rank: RANKS[ri], level: ri + 1, next, progress: next ? (xp - RANKS[ri][0]) / (next[0] - RANKS[ri][0]) : 1 };
}

function selection() {
  const used = new Set(), seen = new Set(), out = [];
  const sig = (pt) => String(pt.headline || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').split(' ').slice(0, 6).join(' ');
  const free = (pt) => !used.has(pt.id) && !seen.has(sig(pt));
  const claim = (pt) => { used.add(pt.id); seen.add(sig(pt)); };
  const allSettled = Object.values(S.packs).every((p) => p.status !== 'loading');
  const order = S.plan.map((x) => x.key);
  for (const s of slots()) {
    const pack = S.packs[s.key];
    if (!pack || pack.status === 'loading') { out.push({ loading: true, key: s.key }); continue; }
    const pts = pack.points || [];
    let chosen = null;
    for (let k = 0; k < pts.length && !chosen; k++) {
      const pt = pts[(s.nth + S.shuffle + order.indexOf(s.key) + k) % pts.length];
      if (free(pt)) chosen = pt;
    }
    if (chosen) { claim(chosen); out.push({ pt: chosen, key: s.key }); }
    else out.push({ spare: true, key: s.key });
  }
  // Fill empty slots (failed or thin packs) with leftovers from any pack once things settle.
  return out.map((o) => {
    if (!o.spare) return o;
    for (const key of order) {
      const pack = S.packs[key];
      if (!pack || pack.status !== 'ok') continue;
      const pt = (pack.points || []).find(free);
      if (pt) { claim(pt); return { pt, key }; }
    }
    return allSettled ? null : { loading: true, key: o.key };
  }).filter(Boolean);
}

/* =============================================================== cards */
const CAT_VARS = ['--a1', '--a2', '--a3', '--a4', '--a5'];

/* =============================================================== eject */

  if (weatherData) { const b = weatherLine(weatherData); pool.push([b.line, `Hand it back: "${b.ask}"`]); }

}

/* =============================================================== setup */

          draft.noSports ? h('p', { class: 'hint', text: "Noted. We'll still slip you one general sports line. Survival requires it." }) : null);

          h('div', { class: 'field', style: 'margin-top:16px' }, h('label', { text: 'Stuff you actually care about (up to 3)' }),
            draft.hobbies.length ? h('div', { class: 'picks' }, ...draft.hobbies.map((t) => h('button', { class: 'pick', 'aria-pressed': 'true', onclick: () => { toggle(draft.hobbies, t); draw(); } }, `${t} ✕`))) : null,

/* ============================================================== footer */

  const sources = new Set(Object.values(S.packs).map((p) => p.source).filter(Boolean));
  let line = 'Fresh batch every morning around 6am Central.';
  if (S.demo) line = 'Preview with sample points. Deploy to Cloudflare for the real thing.';

/* ================================================================ boot */
async function detectBackend() {
  if (location.protocol === 'file:') return false;
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch('/api/health', { cache: 'no-store', signal: ctrl.signal }); clearTimeout(t);
    if (!r.ok) return false;
    const j = await r.json(); return j && j.ok === true;
  } catch { return false; }
}
async function boot() {
  applySkin(S.skin);
  applyProfileDefaults();
  renderBadges(); renderControls(); restingMood();
  // Live if the Worker answers; otherwise (local file, preview) run on sample data.
  S.demo = !(await detectBackend());
  renderHeader(); renderNotices(); renderFoot();
  if (S.demo || profile) { loadPacks(); loadWeather(); }
  else renderCards(true);
  if (!S.demo) {
    fetch('/api/stats').then((r) => r.json()).then(renderGlobal).catch(() => {});
    if (firstVisit) setTimeout(() => openSetup(0), 450);
  }
  setTimeout(() => say(firstVisit ? "Hi, I'm Gulp. I hear everything at this cooler. Tap me for advice." : pick(QUIPS), 4200), 700);
}
boot();
